<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Scontrino Z">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#4f8ef7">
<title>Scontrino Z</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #222636; --border: #2e3347;
    --accent: #4f8ef7; --accent2: #7c3aed; --green: #22c55e; --red: #ef4444;
    --amber: #f59e0b; --text: #e8eaf0; --muted: #7b82a0; --mono: 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }
  header { padding: 14px 18px; padding-top: max(14px, env(safe-area-inset-top)); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
  .logo { width: 38px; height: 38px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  header h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; }
  header p { font-size: 11px; color: var(--muted); margin-top: 1px; }
  main { max-width: 480px; margin: 0 auto; padding: 18px 14px 40px; display: flex; flex-direction: column; gap: 14px; }

  .warn-banner { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); border-radius: 12px; padding: 12px 14px; font-size: 13px; color: var(--amber); cursor: pointer; }
  .warn-banner strong { display: block; margin-bottom: 2px; font-size: 14px; }

  .btn-camera { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 16px; padding: 44px 20px; color: #fff; font-size: 19px; font-weight: 700; cursor: pointer; width: 100%; text-align: center; }
  .btn-camera:active { opacity: 0.85; }
  .btn-camera input { display: none; }
  .upload-icon { font-size: 52px; display: block; margin-bottom: 10px; }
  .btn-file { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; position: relative; }
  .btn-file:active { background: var(--surface2); color: var(--text); }
  .btn-file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }

  #preview-container { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  #preview-img { width: 100%; max-height: 300px; object-fit: contain; background: #000; display: block; }
  .preview-actions { padding: 12px; display: flex; gap: 8px; }

  .btn-primary { flex: 1; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 12px; padding: 16px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn-primary:active { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-ghost { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-ghost:active { background: var(--border); color: var(--text); }

  #status-box { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 30px 20px; text-align: center; }
  .spinner { width: 42px; height: 42px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status-text { font-size: 14px; color: var(--muted); }

  #error-box { display: none; background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); border-radius: 12px; padding: 13px 15px; font-size: 13px; color: var(--red); line-height: 1.5; }

  #result-card { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .result-header { padding: 13px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .result-header h3 { font-size: 14px; font-weight: 700; }
  .badge { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .badge-amber { background: rgba(245,158,11,0.15); color: var(--amber); }
  .date-row { padding: 11px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .date-row span { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
  #date-input { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; color: var(--text); font-family: var(--mono); font-size: 13px; outline: none; flex: 1; }
  #date-input:focus { border-color: var(--accent); }
  .result-row { display: flex; align-items: center; padding: 9px 14px; border-bottom: 1px solid var(--border); gap: 8px; }
  .row-label { font-size: 12px; color: var(--muted); width: 130px; flex-shrink: 0; }
  .row-edit { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; color: var(--text); font-family: var(--mono); font-size: 14px; font-weight: 700; width: 100%; text-align: right; outline: none; }
  .row-edit:focus { border-color: var(--accent); }
  .note-section { padding: 10px 14px 6px; border-bottom: 1px solid var(--border); }
  .note-section label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; display: block; margin-bottom: 5px; }
  #note-input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; color: var(--text); font-size: 13px; outline: none; resize: none; font-family: inherit; }
  #note-input:focus { border-color: var(--accent); }
  .total-row { padding: 14px 16px; background: var(--surface2); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .total-label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .total-value { font-family: var(--mono); font-size: 24px; font-weight: 800; color: var(--accent); letter-spacing: -0.03em; }
  .result-actions { padding: 12px; display: flex; gap: 8px; }

  #success-msg { display: none; background: rgba(34,197,94,0.07); border: 1px solid rgba(34,197,94,0.2); border-radius: 14px; padding: 32px 20px; text-align: center; }
  #success-msg .icon { font-size: 48px; margin-bottom: 10px; }
  #success-msg h3 { font-size: 20px; font-weight: 700; color: var(--green); margin-bottom: 6px; }
  #success-msg p { font-size: 13px; color: var(--muted); line-height: 1.5; }
  #success-msg .btn-ghost { margin-top: 18px; width: 100%; }

  .settings-toggle { text-align: center; font-size: 11px; color: var(--muted); padding: 4px; cursor: pointer; }
  .settings-toggle:active { color: var(--text); }
  #settings-panel { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; flex-direction: column; gap: 10px; }
  #settings-panel.show { display: flex; }
  .setting-row { display: flex; flex-direction: column; gap: 5px; }
  .setting-row label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .setting-row input { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; color: var(--text); font-size: 12px; font-family: var(--mono); outline: none; }
  .setting-row input:focus { border-color: var(--accent); }
  .btn-save { align-self: flex-end; background: var(--accent); border: none; border-radius: 8px; padding: 9px 18px; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn-save:active { opacity: 0.85; }
  #report-panel { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; flex-direction: column; gap: 10px; }
  #report-panel.show { display: flex; }
  .report-ok  { background: rgba(34,197,94,0.07); border: 1px solid rgba(34,197,94,0.2); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--green); }
  .report-err { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--red); }
</style>
</head>
<body>
<header>
  <div class="logo">💊</div>
  <div><h1>Scontrino Z</h1><p>Farmacia della Stazione</p></div>
</header>
<main>
  <div id="warn-banner" class="warn-banner" onclick="openSettings()" style="display:none">
    <strong>Chiave Gemini non configurata</strong>
    Tocca qui → Impostazioni per inserirla.
  </div>

  <label class="btn-camera" id="upload-area">
    <input type="file" id="file-input" accept="image/*" capture="environment">
    <span class="upload-icon">📷</span>
    Scatta lo scontrino Z
  </label>

  <label class="btn-file" id="file-btn">
    <input type="file" id="file-input2" accept="image/*">
    📁 Scegli file
  </label>

  <div id="preview-container">
    <img id="preview-img" alt="Scontrino">
    <div class="preview-actions">
      <button class="btn-primary" id="analyze-btn" onclick="analyzeImage()">🔍 Leggi scontrino</button>
      <button class="btn-ghost" onclick="resetAll()">✕</button>
    </div>
  </div>

  <div id="status-box"><div class="spinner"></div><div id="status-text">Lettura in corso…</div></div>
  <div id="error-box"></div>

  <div id="result-card">
    <div class="result-header"><h3>Dati estratti — verifica</h3><span class="badge badge-amber">Controlla</span></div>
    <div class="date-row"><span>Data</span><input type="date" id="date-input"></div>
    <div id="result-rows"></div>
    <div class="note-section"><label for="note-input">Note</label><textarea id="note-input" rows="2" placeholder="es. n1/PA, bilancia…"></textarea></div>
    <div class="total-row"><span class="total-label">Totale reparti</span><span class="total-value" id="total-display">€ 0,00</span></div>
    <div class="result-actions">
      <button class="btn-primary" id="write-btn" onclick="writeToSheet()">📊 Scrivi nel foglio</button>
      <button class="btn-ghost" onclick="resetAll()">✕</button>
    </div>
  </div>

  <div id="success-msg">
    <div class="icon">✅</div><h3>Foglio aggiornato!</h3>
    <p id="success-detail"></p>
    <button class="btn-ghost" onclick="resetAll()">Nuovo scontrino</button>
  </div>

  <div class="settings-toggle" onclick="toggleReport()">📤 Invia report mensile</div>
  <div id="report-panel">
    <div class="setting-row">
      <label>Mese</label>
      <input type="month" id="report-month" autocomplete="off">
    </div>
    <button class="btn-primary" id="report-btn" onclick="sendReport()">📤 Invia alla contabilità</button>
    <div id="report-result" style="display:none"></div>
  </div>

  <div class="settings-toggle" onclick="toggleSettings()">⚙️ Impostazioni</div>
  <div id="settings-panel">
    <div class="setting-row">
      <label>Chiave API Gemini</label>
      <input type="text" id="gemini-key-input" placeholder="Incolla qui la chiave da aistudio.google.com" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="setting-row">
      <label>URL Apps Script</label>
      <input type="url" id="script-url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <button class="btn-save" onclick="saveSettings()">Salva</button>
  </div>
  <div style="text-align:center;font-size:10px;color:var(--muted);padding:8px 0 2px">v1.1.8</div>
</main>
<script>
const DEFAULT_URL   = 'https://script.google.com/macros/s/AKfycbxTTcAb_3BKOzGnjsTTjSj1rkVRlalzQo2lfip9EOROl_y6yWU_aMXwGsaA7dJC-z5uRA/exec';
const GEMINI_MODEL  = 'gemini-2.5-flash';
const FIELDS = [
  {key:'asl',label:'ASL'},{key:'farmaco',label:'Farmaco'},{key:'parafarmaco',label:'Parafarmaco'},
  {key:'varie',label:'Varie'},{key:'servizi0',label:'Servizi IVA 0%'},{key:'serviziIva',label:'Servizi IVAti'},
  {key:'shopper',label:'Shopper'},{key:'dpi',label:'DPI'},{key:'fatture',label:'Fatture'},
  {key:'scontrini',label:'Scont. annullati'},
];
let imgB64 = null, imgType = 'image/jpeg';

window.addEventListener('load', () => {
  document.getElementById('gemini-key-input').value = localStorage.getItem('gemini_key') || '';
  document.getElementById('script-url').value = localStorage.getItem('gas_url') || DEFAULT_URL;
  document.getElementById('date-input').value = new Date().toISOString().split('T')[0];
  const now = new Date();
  document.getElementById('report-month').value = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  checkKeyWarning();
});

function checkKeyWarning() {
  document.getElementById('warn-banner').style.display = localStorage.getItem('gemini_key') ? 'none' : 'block';
}
function getKey() { return localStorage.getItem('gemini_key') || ''; }
function getUrl() { return (localStorage.getItem('gas_url') || DEFAULT_URL).trim(); }

function toggleReport()   { document.getElementById('report-panel').classList.toggle('show'); }
function toggleSettings() { document.getElementById('settings-panel').classList.toggle('show'); }
function openSettings()   { document.getElementById('settings-panel').classList.add('show'); document.getElementById('settings-panel').scrollIntoView({behavior:'smooth'}); }

function saveSettings() {
  const key = document.getElementById('gemini-key-input').value.trim();
  const url = document.getElementById('script-url').value.trim();
  if (key) localStorage.setItem('gemini_key', key);
  if (url) localStorage.setItem('gas_url', url);
  checkKeyWarning();
  document.getElementById('settings-panel').classList.remove('show');
  toast('Impostazioni salvate ✓');
}

function handleFile(e) {
  const f = e.target.files[0]; if (!f) return;
  imgType = f.type || 'image/jpeg';
  const r = new FileReader();
  r.onload = ev => {
    document.getElementById('preview-img').src = ev.target.result;
    document.getElementById('preview-container').style.display = 'block';
    document.getElementById('upload-area').style.display = 'none';
    document.getElementById('file-btn').style.display = 'none';
    document.getElementById('error-box').style.display = 'none';
    imgB64 = ev.target.result.split(',')[1];
  };
  r.readAsDataURL(f);
}
document.getElementById('file-input').addEventListener('change', handleFile);
document.getElementById('file-input2').addEventListener('change', handleFile);

async function analyzeImage() {
  if (!imgB64) return;
  const key = getKey();
  if (!key) { openSettings(); return showError('Configura prima la chiave Gemini nelle impostazioni.'); }
  setStatus('Lettura scontrino con AI…');
  document.getElementById('analyze-btn').disabled = true;
  try {
    const prompt =
      'Sei un assistente per una farmacia italiana. Analizza questo scontrino Z ' +
      '(Rapporto Reparti Z) e restituisci SOLO un JSON valido.\n\n' +
      'Reparti del registratore di cassa:\n' +
      '01-USL/ASL: ricette SSN — può essere negativo per resi\n' +
      '02-FARMACO: usa "AL NETTO DI SCONTI/MAGG.", NON il lordo\n' +
      '03-PARAFARMACO: usa "AL NETTO DI SCONTI/MAGG.", NON il lordo\n' +
      '04-VARIE: varie\n' +
      '05-SERVIZI IVA 0: servizi esenti IVA (0 se assente)\n' +
      '06-SERVIZI 22%/IVAti: servizi con IVA\n' +
      'SHOPPER: sacchetti (0 se assente)\n' +
      'DPI: dispositivi protezione individuale (0 se assente)\n' +
      'FATTURE: fatture/note credito (0 se assente)\n' +
      'Scontrini annullati: totale scontrini annullati (0 se assente)\n\n' +
      'La DATA è in fondo allo scontrino, vicino a "DOC. GEST." o "CASSA" ' +
      '(formato gg-mm-aaaa). NON usare la "DATA ULTIMO AZZERAMENTO".\n\n' +
      'Restituisci SOLO questo JSON (valori numerici con punto decimale, 0 se assente):\n' +
      '{"data":"YYYY-MM-DD","asl":0,"farmaco":0,"parafarmaco":0,"varie":0,' +
      '"servizi0":0,"serviziIva":0,"shopper":0,"dpi":0,"fatture":0,"scontrini":0}';

    const resp = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${key}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [
            { inline_data: { mime_type: imgType, data: imgB64 } },
            { text: prompt }
          ]}],
          generationConfig: {
            maxOutputTokens: 1024,
            temperature: 0,
            responseMimeType: 'application/json',
            responseSchema: {
              type: 'object',
              properties: {
                data:        { type: 'string' },
                asl:         { type: 'number' },
                farmaco:     { type: 'number' },
                parafarmaco: { type: 'number' },
                varie:       { type: 'number' },
                servizi0:    { type: 'number' },
                serviziIva:  { type: 'number' },
                shopper:     { type: 'number' },
                dpi:         { type: 'number' },
                fatture:     { type: 'number' },
                scontrini:   { type: 'number' }
              },
              required: ['data','asl','farmaco','parafarmaco','varie','servizi0','serviziIva','shopper','dpi','fatture','scontrini']
            }
          }
        })
      }
    );
    const rd = await resp.json();
    if (rd.error) throw new Error('Gemini: ' + rd.error.message);
    const raw = rd.candidates?.[0]?.content?.parts?.[0]?.text ?? '';
    const text = raw.trim();
    let parsed;
    try {
      parsed = JSON.parse(text);
    } catch(e1) {
      const match = text.match(/\{[\s\S]*\}/);
      if (!match) throw new Error('Risposta non valida: ' + text.substring(0, 200));
      try { parsed = JSON.parse(match[0]); }
      catch(e2) { throw new Error('JSON non valido: ' + match[0].substring(0, 200)); }
    }
    hideStatus();
    renderResult(parsed);
  } catch(err) {
    hideStatus(); showError(err.message);
    document.getElementById('analyze-btn').disabled = false;
  }
}

function renderResult(data) {
  if (data.data) document.getElementById('date-input').value = data.data;
  const c = document.getElementById('result-rows'); c.innerHTML = '';
  FIELDS.forEach(f => {
    const v = data[f.key] || 0;
    const row = document.createElement('div'); row.className = 'result-row';
    row.innerHTML = `<span class="row-label">${f.label}</span><input class="row-edit" id="f-${f.key}" type="text" inputmode="decimal" value="${v !== 0 ? fmt(v) : ''}" placeholder="0" oninput="calcTotal()">`;
    c.appendChild(row);
  });
  calcTotal();
  document.getElementById('result-card').style.display = 'block';
}

function fmt(n)   { return n ? parseFloat(n).toFixed(2).replace('.', ',') : ''; }
function parse(s) { return s ? parseFloat(s.replace(',', '.')) || 0 : 0; }

function calcTotal() {
  let t = 0;
  FIELDS.forEach(f => { const el = document.getElementById('f-' + f.key); if (el) t += parse(el.value); });
  document.getElementById('total-display').textContent = '€ ' + t.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

async function writeToSheet() {
  const date = document.getElementById('date-input').value;
  if (!date) return showError('Seleziona la data.');
  const fields = {}; FIELDS.forEach(f => { fields[f.key] = parse(document.getElementById('f-' + f.key)?.value); });
  const note = document.getElementById('note-input').value.trim();
  setStatus('Scrittura nel foglio…'); document.getElementById('write-btn').disabled = true;
  try {
    const resp = await fetch(getUrl(), { method: 'POST', body: JSON.stringify({ fields, date, note }) });
    const data = JSON.parse(await resp.text());
    if (data.error) throw new Error(data.error);
    hideStatus();
    document.getElementById('result-card').style.display = 'none';
    document.getElementById('success-msg').style.display = 'block';
    document.getElementById('success-detail').textContent = `${data.date} · ${data.tab} · Totale € ${fmt(data.total)}`;
  } catch(err) {
    hideStatus(); showError(err.message);
    document.getElementById('write-btn').disabled = false;
  }
}

function setStatus(m) { document.getElementById('status-text').textContent = m; document.getElementById('status-box').style.display = 'block'; }
function hideStatus()  { document.getElementById('status-box').style.display = 'none'; }
function showError(m)  { const el = document.getElementById('error-box'); el.textContent = '⚠️ ' + m; el.style.display = 'block'; el.scrollIntoView({behavior:'smooth',block:'nearest'}); }

function resetAll() {
  imgB64 = null; document.getElementById('file-input').value = ''; document.getElementById('file-input2').value = '';
  document.getElementById('upload-area').style.display = '';
  document.getElementById('file-btn').style.display = '';
  ['preview-container','result-card','status-box','success-msg','error-box'].forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('analyze-btn').disabled = false;
  document.getElementById('note-input').value = '';
  document.getElementById('date-input').value = new Date().toISOString().split('T')[0];
}

async function sendReport() {
  const val = document.getElementById('report-month').value;
  if (!val) return;
  const [year, month] = val.split('-').map(Number);
  const btn    = document.getElementById('report-btn');
  const result = document.getElementById('report-result');
  btn.disabled = true; result.style.display = 'none';
  setStatus('Invio report in corso…');
  try {
    const resp = await fetch(getUrl(), { method: 'POST', body: JSON.stringify({ action: 'sendReport', year, month }) });
    const data = JSON.parse(await resp.text());
    if (data.error) throw new Error(data.error);
    hideStatus();
    result.className = 'report-ok';
    result.textContent = `✓ Report ${data.month} ${data.year} inviato (${data.rows} righe)`;
    result.style.display = 'block';
  } catch(err) {
    hideStatus();
    result.className = 'report-err';
    result.textContent = '⚠️ ' + err.message;
    result.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}

function toast(m) {
  const t = document.createElement('div'); t.textContent = m;
  Object.assign(t.style, {position:'fixed',bottom:'28px',left:'50%',transform:'translateX(-50%)',background:'#222636',color:'#e8eaf0',padding:'10px 20px',borderRadius:'99px',fontSize:'13px',fontWeight:'600',zIndex:'999',border:'1px solid #2e3347'});
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
</script>
